name: Lint

on:
  pull_request:
  push:
    branches: [master]

jobs:
  hemtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HEMTT
        run: |
          curl -sSf https://hemtt.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.hemtt/bin" >> "$GITHUB_PATH"
      - name: HEMTT check
        run: |
          hemtt --version
          tools/lint.sh -v
